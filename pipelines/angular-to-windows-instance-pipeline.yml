# =====================================================================
# angular-to-windows-instance-pipeline.yml
#
# Angular / frontend app -> IIS on a Windows VM.
#
# Previously this and angular-to-ubuntu-instance-pipeline.yml were merged
# into a single angular-to-instance-pipeline.yml with a targetPlatform
# switch. Ubuntu/nginx is no longer a deploy target, so the switch had one
# value left and has been removed -- this is a plain Windows pipeline again.
#
# It retains the three fixes that had only ever existed on the Windows side:
#   1. hotfix build-command selection (the Ubuntu copy indexed
#      environmentConfig with the raw branch name, null on a hotfix branch)
#   2. redundant isHotFix check removed from the dev DAST/QA guard
#   3. no stray backslash on `port:`
# =====================================================================

variables:
  - name: nodeVersion
    value: '24'


  - name: qualysServiceConnection
    value: 'Test_Qualys'

  - name: dastTool
    value: 'qualys'
  
  - name: snykServiceConnection
    value: 'Test_Snyk2'

  - name: azureServiceConnection
    value: 'ARM-ServiceConnection'
  - name: isHotFix
    value: true
  
  - name: browserStackServiceConnection
    value: 'Test_BrowserStack'

  - ${{ if eq(lower(variables['Build.SourceBranchName']), 'dev') }}:
    - name: isHotFix
      value: false
    - name: azureServiceConnection
      value: 'ARM-ServiceConnection'
    
  - ${{ if eq(lower(variables['Build.SourceBranchName']), 'uat') }}:
    - name: isHotFix
      value: false
    - name: azureServiceConnection
      value: 'ARM-ServiceConnection'
  
  - ${{ if eq(lower(variables['Build.SourceBranchName']), 'pilot') }}:
    - name: isHotFix
      value: false
    - name: azureServiceConnection
      value: 'ARM-ServiceConnection'
  
  - ${{ if eq(lower(variables['Build.SourceBranchName']), 'production') }}:
    - name: isHotFix
      value: false
    - name: azureServiceConnection
      value: 'ARM-ServiceConnection'

  - ${{ if startsWith(lower(variables['Build.SourceBranch']), 'refs/heads/hotfix/') }}:
    - name: azureServiceConnection
      value: 'ARM-ServiceConnection'

parameters:

  # ---------- Required project-specific parameters ----------
  - name: projectName
    type: string

  # ---------- Optional parameters with defaults ----------
  - name: environmentConfig
    type: object
    default:
      dev:
        environmentName: 'dev'
        buildCommand: 'npm run build-dev'
        poolName: 'AgentPool-DEV_UAT'
      uat:
        environmentName: 'uat'
        buildCommand: 'npm run build-uat'
        poolName: 'AgentPool-DEV_UAT'
      pilot:
        environmentName: 'pilot'
        buildCommand: 'npm run build-pilot'
        poolName: 'AgentPool-PROD'
      production:
        environmentName: 'production'
        buildCommand: 'npm run build-prod'
        poolName: 'AgentPool-PROD'
      dr:
        environmentName: 'dr'
        buildCommand: 'npm run build-prod'
        poolName: 'AgentPool-DR'

  - name: useKeyVault
    type: boolean
    default: false

  - name: buildCommand
    type: string
    default: ''

  - name: buildOutputPath
    type: string
    default: 'dist'

  - name: BuildType
    type: string
    default: 'none'

  - name: poolName
    type: string
    default: ''

  - name: deployPath
    type: string
    default: 'D:\Applications\DevSecOpsUI'

  - name: qualysWebAppName
    type: string

  - name: port
    type: number

  - name: qaRepoName
    type: string
    default: Plain_QA_Automation_Repo
  - name: qaAzureProject
    type: string
    default: DevSecOps Transformation
  
  - name: customSubFolderForArtifact
    type: string
    default: ''
  - name: customDestinationFolder
    type: string
    default: ''

  - name: backupRoot
    type: string
    default: 'D:\Applications\Backups'

  - name: rollbackToBuildId      # empty = latest backup in manifest
    type: string
    default: ''
  
  - name: healthCheckPath
    type: string
    default: '/'

stages:
  # --------------------------------------------------------------------
  # Stage 1: Build React app + SAST Scan
  # --------------------------------------------------------------------
  - template: ../templates/stages/dynamic-stage.yml
    parameters:
      jobTemplate: ../jobs/build-scan-publish-frontend.yml
      jobParameters:
        poolName: ${{ parameters.poolName }}
        nodeVersion: $(nodeVersion)
        # FIX: environmentConfig[branchName] doesn't exist for hotfix branches,
        # so pick the build command differently per case
        ${{ if eq(variables['isHotFix'], 'true') }}:
          buildCommand: ${{ coalesce(parameters.buildCommand, 'npm run build-prod') }}
        ${{ else }}:
          buildCommand: ${{ coalesce(parameters.buildCommand, parameters.environmentConfig[lower(variables['Build.SourceBranchName'])].buildCommand) }}
        buildOutputPath: ${{ parameters.buildOutputPath }}
        projectName: ${{ coalesce(parameters.projectName, variables['Build.Repository.Name']) }}
        useKeyVault: ${{ parameters.useKeyVault }}
        environment: ${{ lower(variables['Build.SourceBranchName']) }}

        BuildType: ${{ parameters.BuildType }}
      stageName: 'Build_And_Security'
      displayName: 'Run SAST+SCA Scans, Test, Build and Publish Artifacts'

  # --------------------------------------------------------------------
  # Stage 2: Deploy to Virtual Machines
  # --------------------------------------------------------------------
  - ${{ if ne(variables['isHotFix'], 'true') }}:
    - template: ../templates/stages/deploy-to-instance-stage.yml
      parameters:
        platform: windows
        target: 'Virtual Machine'
        environment: ${{ lower(variables['Build.SourceBranchName']) }}
        environmentConfig: ${{ parameters.environmentConfig }}
        deploymentParameters:
          projectName: ${{ coalesce(parameters.projectName, variables['Build.Repository.Name']) }}
          deployPath: ${{ parameters.deployPath }}
          customSubFolderForArtifact: ${{parameters.customSubFolderForArtifact}}
          customDestinationFolder: ${{ parameters.customDestinationFolder }}
          port: ${{ parameters.port }}
  - ${{ else }}:
    - ${{ each env in split('dev,uat,pilot', ',') }}: #include production before going live with it
      - template: ../templates/stages/deploy-to-instance-stage.yml
        parameters:
          platform: windows
          target: 'Virtual Machine'
          environment: ${{ env }}
          environmentConfig: ${{ parameters.environmentConfig }}
          deploymentParameters:
            projectName: ${{ coalesce(parameters.projectName, variables['Build.Repository.Name']) }}
            deployPath: ${{ parameters.deployPath }}
            customSubFolderForArtifact: ${{parameters.customSubFolderForArtifact}}
            customDestinationFolder: ${{ parameters.customDestinationFolder }}
            port: ${{ parameters.port }}

      # Run DAST + QA once, after the dev deployment (hotfix path only)
      # FIX: isHotFix check removed — we're already in the else branch
      - ${{ if eq(env, 'dev') }}:
        - template: ../templates/stages/dynamic-stage.yml
          parameters:
            jobTemplate: ../jobs/dast-scan.yml
            jobParameters:
              poolName: ''
              qualysWebAppName: ${{ parameters.qualysWebAppName }}
              qualysServiceConnection: $(qualysServiceConnection)
              dastTool: $(dastTool)
              environment: ${{ env }}
            stageName: DAST_${{ env }}
            displayName: 'Dynamic Application Security Scanning with Qualys'
            dependsOn:
              - Deploy_${{ env }}
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

        - template: ../templates/stages/dynamic-stage.yml
          parameters:
            jobTemplate: ../jobs/qa-test.yml
            jobParameters:
              projectFolder: ''
              qaAzureProject: ${{ parameters.qaAzureProject }}
              qaRepoName: ${{ parameters.qaRepoName }}
              # poolName: ''
              poolName: ${{ parameters.environmentConfig[env].poolName }}
            stageName: 'QA_Test'
            displayName: 'Run QA test with Browserstack'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            dependsOn:
              - DAST_${{ env }}

        - template: ../templates/stages/dynamic-stage.yml
          parameters:
            jobTemplate: ../jobs/rollback-instance-deployment.yml
            jobParameters:
              platform: windows
              poolName: ''
              projectName: ${{ coalesce(parameters.projectName, variables['Build.Repository.Name']) }}
              deployPath: ${{ parameters.deployPath }}
              port: ${{ parameters.port }}
              backupRoot: ${{ parameters.backupRoot }}
              rollbackToBuildId: ${{ parameters.rollbackToBuildId }}      # empty = latest backup in manifest
              healthCheckPath: ${{ parameters.healthCheckPath }}
              environmentConfig: ${{ parameters.environmentConfig[env]  }}
            stageName: 'Rollback_IIS'
            displayName: 'Rollback IIS Deployments'
            dependsOn: 
              -  QA_Test # change to DAST_production when you include production
            condition: >
                and(
                  eq(dependencies.Deploy_${{ env }}.result, 'Succeeded'),
                  or(eq(dependencies.DAST_${{ env }}.result, 'Failed'), eq(dependencies.QA_Test.result, 'Failed')),
                  ne(dependencies.Deploy_${{ env }}.outputs['Build_Frontend.healthGate.ROLLBACK_PERFORMED'], 'true')
                )

  # --------------------------------------------------------------------
  # Stage 3: DAST — skipped for hotfix
  # --------------------------------------------------------------------
  - ${{ if ne(variables['isHotFix'], 'true') }}:
    - template: ../templates/stages/dynamic-stage.yml
      parameters:
        jobTemplate: ../jobs/dast-scan.yml
        dependsOn:
          - Deploy_${{ lower(variables['Build.SourceBranchName']) }}
        condition: "succeeded()"
        jobParameters:
          poolName: ''
          qualysWebAppName: ${{ parameters.qualysWebAppName }}
          qualysServiceConnection: $(qualysServiceConnection)
          dastTool: $(dastTool)
          environment: ${{ lower(variables['Build.SourceBranchName']) }}
        stageName: DAST_${{ lower(variables['Build.SourceBranchName']) }}
        displayName: 'Dynamic Application Security Scanning with Qualys'

  # --------------------------------------------------------------------
  # Stage 4: QA Test — skipped for hotfix
  # --------------------------------------------------------------------
  - ${{ if ne(variables['isHotFix'], 'true') }}:
    - template: ../templates/stages/dynamic-stage.yml
      parameters:
        jobTemplate: ../jobs/qa-test.yml
        dependsOn:
          - DAST_${{ lower(variables['Build.SourceBranchName']) }}
        condition: "succeeded()"
        jobParameters:
          projectFolder: ${{ coalesce(parameters.projectName, variables['Build.Repository.Name']) }}
          qaAzureProject: ${{ parameters.qaAzureProject }}
          qaRepoName: ${{ parameters.qaRepoName }}
          poolName: ${{ parameters.environmentConfig[lower(variables['Build.SourceBranchName'])].poolName }}
          # poolName: ''
        stageName: 'QA_Test'
        displayName: 'Run QA test with Browserstack'
  
  # --------------------------------------------------------------------
  # Stage 5: Rollback Stage
  # --------------------------------------------------------------------
  - ${{ if ne(variables['isHotFix'], 'true') }}:
    - template: ../templates/stages/dynamic-stage.yml
      parameters:
        jobTemplate: ../jobs/rollback-instance-deployment.yml
        jobParameters:
          platform: windows
          poolName: ''
          projectName: ${{ coalesce(parameters.projectName, variables['Build.Repository.Name']) }}
          deployPath: ${{ parameters.deployPath }}
          port: ${{ parameters.port }}
          backupRoot: ${{ parameters.backupRoot }}
          rollbackToBuildId: ${{ parameters.rollbackToBuildId }}      # empty = latest backup in manifest
          healthCheckPath: ${{ parameters.healthCheckPath }}
          environmentConfig: ${{ parameters.environmentConfig[lower(variables['Build.SourceBranchName'])] }}
        stageName: 'Rollback_IIS'
        displayName: 'Rollback IIS Deployments'
        dependsOn: 
          - 'QA_Test'
        condition: >
          and(
            eq(dependencies.Deploy_${{ lower(variables['Build.SourceBranchName']) }}.result, 'Succeeded'),
            or(eq(dependencies.DAST_${{ lower(variables['Build.SourceBranchName']) }}.result, 'Failed'), eq(dependencies.QA_Test.result, 'Failed')),
            ne(dependencies.Deploy_${{ lower(variables['Build.SourceBranchName']) }}.outputs['Build_Frontend.healthGate.ROLLBACK_PERFORMED'], 'true')
          )

  # --------------------------------------------------------------------
  # Stage 6: Deploy to DR after production
  # --------------------------------------------------------------------
  - ${{ if eq(lower(variables['Build.SourceBranchName']), 'production') }}:
    - template: ../templates/stages/deploy-to-instance-stage.yml
      parameters:
        platform: windows
        target: 'Virtual Machine'
        environment: 'dr'
        environmentConfig: ${{ parameters.environmentConfig }}
        deploymentParameters:
          projectName: ${{ coalesce(parameters.projectName, variables['Build.Repository.Name']) }}
          deployPath: ${{ parameters.deployPath }}
          port: ${{ parameters.port }}
          customSubFolderForArtifact: ${{parameters.customSubFolderForArtifact}}
          customDestinationFolder: ${{ parameters.customDestinationFolder }}

